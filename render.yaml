services:
  - type: web
    name: jansetu
    env: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn jansetu.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
